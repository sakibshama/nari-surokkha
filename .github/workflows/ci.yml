name: CI — Nari Surokkha

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend API ────────────────────────────────────────────
  api-checks:
    name: API — Lint, Type-Check, Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: nari_test
          POSTGRES_USER: nari_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install ALL workspaces from the root lockfile (links @nari-surokkha/shared).
      - name: Install dependencies
        run: npm ci

      # The API depends on the shared package's build output — build it first.
      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client
        working-directory: services/api
        run: npx prisma generate

      - name: Type check
        working-directory: services/api
        run: npm run type-check

      - name: Lint
        working-directory: services/api
        run: npm run lint

      # Integration/E2E tests hit the real test DB — apply the schema first.
      - name: Apply migrations to test DB
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://nari_user:test_password@localhost:5432/nari_test
        run: npx prisma migrate deploy

      # Coverage thresholds live in vitest.config.ts. They were 70/70/60 and
      # nothing enforced them -- `npm test` never passed --coverage -- so they
      # were decoration. Measured and reset to a ratchet just under the real
      # numbers; running with --coverage makes them a genuine regression gate.
      # Note this job runs ALL projects against the live Postgres service
      # above, so its coverage is higher than a local unit-only run.
      - name: Run tests with coverage gate
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://nari_user:test_password@localhost:5432/nari_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_at_least_64_chars_long_xxxxxxxxxxxxxxxxxxxxxxxxxx
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_64_chars_long_xxxxxxxxxxxxxxxx
          NODE_ENV: test
          SMS_PROVIDER: mock
        run: npm run test:coverage

  # ─── Police Portal ──────────────────────────────────────────
  police-portal-checks:
    name: Police Portal — Lint, Type-Check, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build --workspace=packages/shared
      - name: Type check
        working-directory: apps/police-portal
        run: npm run type-check
      - name: Lint
        working-directory: apps/police-portal
        run: npm run lint
      - name: Build
        working-directory: apps/police-portal
        run: npm run build

  # ─── Admin Portal ───────────────────────────────────────────
  admin-portal-checks:
    name: Admin Portal — Lint, Build (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build --workspace=packages/shared
      - name: Lint
        working-directory: apps/admin-portal
        run: npm run lint
      # `build` runs `tsc -b` first, so this also type-checks the portal.
      - name: Build
        working-directory: apps/admin-portal
        run: npm run build

  # ─── Mobile App ─────────────────────────────────────────────
  mobile-checks:
    name: Mobile — Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build --workspace=packages/shared
      - name: Type check
        working-directory: apps/mobile
        run: npm run type-check

  # ─── Shared Package ─────────────────────────────────────────
  shared-checks:
    name: Shared Package — Type-Check, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --workspace=packages/shared

  # ─── ML Service ─────────────────────────────────────────────
  ml-service-checks:
    name: ML Service — Lint, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-service
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check .
      # Real inference guardrails — fail if the service ever regresses to the
      # old random mock (models must load, probs sum to 1, fall → emergency).
      - name: Test
        run: pytest -q --tb=short

  # ─── Migrations ─────────────────────────────────────────────
  # The migrations are hand-written SQL with PostGIS geometry columns, sync
  # triggers and a retention function -- none of which Prisma generates or
  # validates. Applying them to a real PostGIS database on every PR is the only
  # way to know they still work, and re-applying them proves they are
  # idempotent (they use IF NOT EXISTS / OR REPLACE throughout, and a broken
  # one would fail a redeploy at the worst possible moment).
  migration-checks:
    name: Migrations — Apply and Re-apply
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: nari_migrate
          POSTGRES_USER: nari_user
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4

      - name: Apply every migration in order
        run: |
          set -e
          for d in services/api/prisma/migrations/2026*/; do
            echo "→ $d"
            psql -h localhost -U nari_user -d nari_migrate -v ON_ERROR_STOP=1 -q -f "$d/migration.sql"
          done

      - name: Re-apply the two newest (idempotency)
        run: |
          set -e
          for d in 20260819000000_spatial_index_usage 20260819100000_retention_and_search; do
            psql -h localhost -U nari_user -d nari_migrate -v ON_ERROR_STOP=1 -q \
              -f "services/api/prisma/migrations/$d/migration.sql"
          done

      - name: Assert the spatial indexes are actually usable
        run: |
          set -e
          psql -h localhost -U nari_user -d nari_migrate -v ON_ERROR_STOP=1 <<'SQL'
          -- Enough rows that a seq scan would be the cheaper plan if the
          -- geography index could not be used.
          INSERT INTO users (id, phone, password_hash, status)
          SELECT gen_random_uuid(), '+88017'||lpad(i::text,8,'0'), 'x', 'active'
          FROM generate_series(1,20000) i;
          INSERT INTO responders (id, user_id, status, availability, latitude, longitude)
          SELECT gen_random_uuid(), u.id, 'verified', 'available',
                 23.70+random()*0.25, 90.30+random()*0.25 FROM users u;
          ANALYZE responders;
          SQL

          PLAN=$(psql -h localhost -U nari_user -d nari_migrate -tAc "EXPLAIN SELECT id FROM responders WHERE status='verified' AND availability='available' AND ST_DWithin(location::geography, ST_SetSRID(ST_MakePoint(90.41,23.81),4326)::geography, 5000);")
          echo "$PLAN"
          # This is THE regression guard for the whole spatial fix. A stray
          # "location IS NOT NULL" in the query, or a dropped index, silently
          # turns an index scan back into a full filter -- which is exactly the
          # bug that existed before, and it produces correct results, just slowly.
          echo "$PLAN" | grep -q "idx_responders_location_geog" \
            || { echo "::error::Spatial query is NOT using idx_responders_location_geog"; echo "$PLAN"; exit 1; }
          echo "✅ geography index in use"

      - name: Assert retention never deletes evidence for an open case
        run: |
          set -e
          psql -h localhost -U nari_user -d nari_migrate -v ON_ERROR_STOP=1 <<'SQL'
          WITH u AS (SELECT id FROM users LIMIT 1),
          a AS (
            INSERT INTO emergency_alerts (user_id, type, status, latitude, longitude, created_at)
            SELECT u.id,'manual','in_progress',23.8,90.4, NOW() - INTERVAL '400 days' FROM u
            RETURNING id
          )
          INSERT INTO alert_locations (alert_id, latitude, longitude, timestamp)
          SELECT a.id, 23.8, 90.4, NOW() - INTERVAL '400 days' FROM a, generate_series(1,10);
          SQL
          psql -h localhost -U nari_user -d nari_migrate -tAc "SELECT prune_old_records();" >/dev/null
          KEPT=$(psql -h localhost -U nari_user -d nari_migrate -tAc "SELECT count(*) FROM alert_locations al JOIN emergency_alerts e ON e.id=al.alert_id WHERE e.closed_at IS NULL;" | tr -d ' ')
          [ "$KEPT" = "10" ] || { echo "::error::Retention deleted the trail of an OPEN alert (kept $KEPT of 10)"; exit 1; }
          echo "✅ open-case evidence preserved"

  # ─── Portals ────────────────────────────────────────────────
  portal-checks:
    name: Portals — Build and Bundle Budget
    runs-on: ubuntu-latest
    strategy:
      matrix:
        portal: [admin-portal, police-portal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build shared package
        run: npm run build --workspace=packages/shared
      - name: Build
        working-directory: apps/${{ matrix.portal }}
        env:
          VITE_API_URL: https://api.example.com/api/v1
          VITE_WS_URL: wss://api.example.com
        run: npm run build

      # Code splitting is easy to add and easy to lose, and the obvious check
      # does not catch losing it. Measuring the ENTRY CHUNK alone passes even
      # when Vite emits <link rel="modulepreload"> for a lazily-imported
      # library -- which is exactly what happened here: naming recharts in
      # manualChunks hoisted it into the entry's graph, so 380KB of charting
      # was preloaded on every page load while the entry chunk still read
      # 104KB and looked fine.
      #
      # So this budgets what the browser ACTUALLY fetches before the user
      # interacts: the entry script, every modulepreload, and the stylesheet.
      - name: First-paint bundle budget
        working-directory: apps/${{ matrix.portal }}
        run: |
          python3 - <<'PY'
          import re, os, sys
          html = open('dist/index.html').read()
          sizes = {f: os.path.getsize(f'dist/assets/{f}') for f in os.listdir('dist/assets')}
          eager = set(re.findall(r'(?:src|href)="/assets/([^"]+)"', html))
          first_paint = sum(sizes.get(f, 0) for f in eager)
          deferred = sum(sizes.values()) - first_paint
          budget = 600 * 1024

          for f in sorted(eager, key=lambda x: -sizes.get(x, 0)):
              print(f"  {sizes.get(f,0)/1024:8.1f} KB  {f}")
          print(f"  first paint : {first_paint/1024:.1f} KB (budget {budget/1024:.0f} KB)")
          print(f"  deferred    : {deferred/1024:.1f} KB")

          fail = False
          if first_paint > budget:
              print(f"::error::First-paint bundle {first_paint/1024:.0f}KB exceeds {budget/1024:.0f}KB. "
                    "A lazily-used library has most likely been added to manualChunks, "
                    "which hoists it into the entry graph and gets it preloaded.")
              fail = True
          if len(sizes) < 8:
              print(f"::error::Only {len(sizes)} build assets -- route-level code splitting appears to have been lost.")
              fail = True
          if deferred < first_paint * 0.5:
              print(f"::error::Only {deferred/1024:.0f}KB is deferred vs {first_paint/1024:.0f}KB eager -- "
                    "lazy routes are not actually deferring their dependencies.")
              fail = True
          sys.exit(1 if fail else 0)
          PY

  # ─── Docker ─────────────────────────────────────────────────
  # CI type-checked and tested the source but never proved the images build.
  # A broken Dockerfile was therefore only discovered at deploy time.
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ML service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ml-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Load test scripts ──────────────────────────────────────
  # Does not run a load test (that needs a deployed target). It verifies the
  # scripts still parse and their thresholds are registered, so a broken load
  # test is found now rather than during an incident when someone reaches for it.
  loadtest-lint:
    name: Load Tests — Validate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin k6-v0.54.0-linux-amd64/k6
      - name: Validate
        run: |
          set -e
          for f in load/*.js; do
            echo "→ $f"
            k6 inspect "$f" > /dev/null
          done
          echo "✅ all load scripts parse"
