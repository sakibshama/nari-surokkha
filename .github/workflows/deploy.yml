name: Deploy — Nari Surokkha (VPS)

# Deploys a version tag. Pushing a tag `v*` deploys it; a manual run asks for
# the tag. The images AND the compose file / nginx config / scripts on the
# server all come from that exact tag — never from the tip of main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to deploy (e.g. v1.4.2)'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY_BASE: ghcr.io/${{ github.repository_owner }}/nari-surokkha
  DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ─── Resolve the tag to a commit ───────────────────────────
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.DEPLOY_TAG }}
          fetch-depth: 1
      - id: r
        run: |
          set -euo pipefail
          case "$DEPLOY_TAG" in v*) ;; *) echo "::error::'$DEPLOY_TAG' is not a v* tag"; exit 1;; esac
          echo "tag=$DEPLOY_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─── Build & push all images to GHCR ────────────────────────
  build:
    name: Build & push images
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
            build_args: ""
          - name: admin-portal
            dockerfile: apps/admin-portal/Dockerfile
            build_args: |
              VITE_API_URL=${{ vars.PUBLIC_API_URL }}
              VITE_WS_URL=${{ vars.PUBLIC_WS_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY_BASE }}/${{ matrix.name }}:${{ needs.resolve.outputs.tag }}
            ${{ env.REGISTRY_BASE }}/${{ matrix.name }}:${{ needs.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to the VPS over SSH ─────────────────────────────
  deploy:
    name: Deploy ${{ needs.resolve.outputs.tag }} to VPS
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_TAG: ${{ needs.resolve.outputs.tag }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          REGISTRY: ${{ env.REGISTRY_BASE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_TAG,DEPLOY_SHA,REGISTRY,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            # Compose file, nginx template, scripts: EXACTLY the deployed tag.
            git fetch --force --tags origin
            git -c advice.detachedHead=false checkout --force "refs/tags/${DEPLOY_TAG}"
            test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}" || { echo "tag ${DEPLOY_TAG} moved"; exit 1; }

            # Authenticate to GHCR to pull the freshly built images
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export REGISTRY
            export TAG="${DEPLOY_TAG}"
            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

            $COMPOSE pull api worker admin-portal
            # Apply DB migrations (via DIRECT_DATABASE_URL) before starting the new version
            $COMPOSE run --rm api npx prisma migrate deploy
            $COMPOSE up -d --remove-orphans
            docker image prune -f

            # Show health
            sleep 10
            $COMPOSE ps
            echo "Deployed ${DEPLOY_TAG} (${DEPLOY_SHA})"
