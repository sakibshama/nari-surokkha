# Proxy settings shared by every location that forwards to the API.
proxy_pass http://nari_api;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# nginx is the edge: OVERWRITE X-Forwarded-For with the address that actually
# connected, never append to a client-supplied header. The API runs with
# TRUST_PROXY=1 (one trusted hop), so request.ip is this value and a spoofed
# X-Forwarded-For can no longer dodge the rate limits (B3).
# If you ever put a CDN (e.g. Cloudflare) in front, configure
# set_real_ip_from / real_ip_header first, or every user shares the CDN's IP.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# WebSocket / Socket.IO upgrade. $connection_upgrade is "upgrade" for
# upgrade requests and empty otherwise (which keeps upstream keepalive).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Retry the next replica if one is unhealthy, so a single bad container does
# not surface as a failed SOS. Only for idempotent-safe failures.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
