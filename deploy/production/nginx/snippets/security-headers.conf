# Common security headers.
#
# nginx's add_header is NOT inherited by a location that sets any add_header
# of its own, so include this file at server level AND inside every location
# that calls add_header (e.g. the long-cache /assets/ block).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
