# Staging reverse proxy: one origin for the admin portal and the API.
# Requires nginx >= 1.27.3 (`server ... resolve`).

# Docker DNS: re-resolve service names so a recreated API container does not
# leave nginx pointing at a dead IP.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream staging_api {
    zone staging_api 64k;
    server api:3001 resolve;
    keepalive 16;
}

upstream staging_portal {
    zone staging_portal 64k;
    server admin-portal:8080 resolve;
}

server {
    listen 80;
    server_name _;   # Replace with the staging domain
    server_tokens off;
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API, Socket.IO, public tracking (/t) and contact consent (/c) pages.
    location ~ ^/(api|socket\.io|t|c|health)(/|$) {
        proxy_pass http://staging_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the API trusts exactly one proxy hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /metrics { return 404; }
    location /queues  { return 404; }

    # Admin portal (SPA; the portal container handles client-side routes).
    location / {
        proxy_pass http://staging_portal;
        proxy_set_header Host $host;
    }
}
