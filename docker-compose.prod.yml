# ============================================================
# Nari Surokkha — Production stack for a single VPS
#
# Bring up:   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Migrate:    docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api npx prisma migrate deploy
# Logs:       docker compose -f docker-compose.prod.yml logs -f api
#
# Images are pulled from your container registry in CI/CD (REGISTRY + TAG),
# and fall back to building locally if not present.
#
# Seed roles (first deploy; demo users are never seeded in production):
#             docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api npm run prisma:seed
# Point-in-time recovery (WAL-G): add -f deploy/production/walg/docker-compose.walg.yml
#             (see docs/operations/backup-and-restore.md)
# ============================================================

# ─── Shared defaults ─────────────────────────────────────────
# Docker's default json-file driver has NO size limit. On a long-running VPS
# that fills the disk, and a full disk stops Postgres accepting writes — i.e.
# an SOS that cannot be recorded. Every service below inherits this cap.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ─── PostgreSQL + PostGIS ──────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nari_surokkha}
      POSTGRES_USER: ${POSTGRES_USER:-nari_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Stock Postgres defaults assume a machine far smaller than this VPS and
    # leave most of its memory unused. Sized for ~8GB RAM; scale with the host.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - random_page_cost=1.1          # SSD, not spinning rust
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-4g}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nari_user} -d ${POSTGRES_DB:-nari_surokkha}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # noeviction: Redis holds BullMQ jobs and live tracking tokens. Silently
    # evicting either would drop an SOS notification or break a family's
    # tracking link — better to fail loudly than to lose one.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-768m}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  # ─── PgBouncer ─────────────────────────────────────────────
  # Every API/worker replica opens its own Prisma pool. Without a pooler you
  # exhaust Postgres max_connections after a handful of replicas -- which is
  # what made "just add another API container" impossible.
  #
  # Transaction mode + Prisma requires two URLs:
  #   DATABASE_URL         -> pgbouncer  (runtime queries, pooled)
  #   DIRECT_DATABASE_URL  -> postgres   (migrations; DDL and advisory locks
  #                                       cannot go through a transaction pooler)
  # See .env.production.example.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-nari_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-nari_surokkha}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGB_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGB_DEFAULT_POOL_SIZE:-25}
      AUTH_TYPE: scram-sha-256
      # Prisma manages its own prepared statements; they are incompatible with
      # transaction pooling unless disabled here and via ?pgbouncer=true.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-nari_user} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [internal]

  # ─── API (Fastify) ─────────────────────────────────────────
  api:
    image: ${REGISTRY:-nari-surokkha}/api:${TAG:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      # HTTP only. Background jobs run in the `worker` service below, so a
      # burst of SMS/dispatch work can never compete with request handling on
      # this process's event loop.
      WORKER_MODE: "false"
      # Evidence stored on the server disk (bind-mounted for backups).
      # Switch STORAGE_PROVIDER to aws-s3 / cloudflare-r2 to drop this volume
      # entirely — it is the last thing pinning the API to a single host.
      STORAGE_LOCAL_DIR: /app/uploads
      # Prometheus scrape port. Internal network only; never proxied by nginx.
      METRICS_PORT: "9091"
      # Safe Route routing engine. Defaults to the self-hosted OSRM below when
      # you run the `osrm` profile; otherwise falls back to the public demo.
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      # WebRTC ICE — the API serves these to clients via /config/ice-servers.
      # With TURN_SECRET set, each client gets a short-lived HMAC credential
      # (coturn use-auth-secret / REST scheme) derived from the SAME secret the
      # coturn container below verifies with. No static password is handed out.
      # TURN_HOST is the public host clients relay through (e.g. api.example.com).
      TURN_HOST: ${TURN_HOST:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # nginx is the single trusted proxy hop in front of the API (B3).
      TRUST_PROXY: ${TRUST_PROXY:-1}
    # The image runs as uid 1000 (node): the host directory must be writable
    # by it — `sudo chown -R 1000:1000 $UPLOADS_DIR` (vps-setup.sh does this).
    volumes:
      - ${UPLOADS_DIR:-./data/uploads}:/app/uploads
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to ::1 and Node
      # binds IPv4 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      # Scale out with:  docker compose ... up -d --scale api=3
      # Safe now that workers are separate, Socket.IO uses the Redis adapter,
      # rate limiting is Redis-backed and nginx load-balances the upstream.
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-1g}
    networks: [internal]

  # ─── Worker (same image, jobs only) ────────────────────────
  # Previously the BullMQ workers were registered inside buildApp(), so every
  # API process also processed notifications and dispatch. That coupled two
  # very different workloads on one event loop and made it impossible to scale
  # them independently. Same image, WORKER_MODE=true, no HTTP listener.
  worker:
    image: ${REGISTRY:-nari-surokkha}/api:${TAG:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      WORKER_MODE: "true"
      STORAGE_LOCAL_DIR: /app/uploads
      METRICS_PORT: "9091"
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    volumes:
      - ${UPLOADS_DIR:-./data/uploads}:/app/uploads
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-1g}
    networks: [internal]

  # ─── OSRM routing engine (Safe Route) — opt-in ────────────
  # Self-hosted road routing so Safe Route doesn't depend on the public demo
  # server. Started only with `--profile osrm` because it needs a one-time data
  # build first. Prepare the Bangladesh map once, then bring it up:
  #
  #   ./scripts/osrm-prepare.sh          # downloads + builds ./data/osrm (foot profile)
  #   docker compose -f docker-compose.prod.yml --profile osrm up -d osrm
  #
  # The API reaches it at http://osrm:5000 (set OSRM_URL, already defaulted).
  osrm:
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld --max-matching-size 2000 /data/map.osrm
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${OSRM_MEM_LIMIT:-2g}
    volumes:
      - ${OSRM_DIR:-./data/osrm}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:5000/route/v1/foot/90.4,23.8;90.41,23.81' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ─── Admin Portal (static, nginx) ──────────────────────────
  admin-portal:
    image: ${REGISTRY:-nari-surokkha}/admin-portal:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
      args:
        VITE_API_URL: ${ADMIN_VITE_API_URL:?ADMIN_VITE_API_URL is required}
        VITE_WS_URL: ${PUBLIC_WS_URL:?PUBLIC_WS_URL is required}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [internal]

  # ─── TURN relay (WebRTC across NAT/CGNAT — required for live
  #     streaming when phone and portal are on different networks) ─
  # Auth: coturn's REST/`use-auth-secret` scheme. The API mints a credential
  # valid for 1 hour (username "<expiry>:<userId>", password =
  # base64(HMAC-SHA1(TURN_SECRET, username))); coturn verifies it with the same
  # secret. Nothing long-lived ever reaches a client (B5).
  #
  # --denied-peer-ip: a TURN relay is an open proxy into whatever network it
  # sits on. These ranges stop an authenticated user from relaying to the
  # Docker network, the VPS loopback, link-local metadata or any private LAN.
  #
  # Firewall: 3478/tcp+udp and the UDP relay range 49152-49200 (vps-setup.sh).
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    logging: *default-logging
    # Host networking: TURN must advertise the real public IP and use a
    # UDP relay port range — Docker NAT breaks both.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required (openssl rand -hex 32)}
      - --realm=${DOMAIN:?DOMAIN is required}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49200
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

  # ─── Monitoring ────────────────────────────────────────────
  # Start with:  docker compose -f docker-compose.prod.yml --profile monitoring up -d
  #
  # None of these are exposed publicly — reach Grafana over an SSH tunnel:
  #   ssh -L 3000:localhost:3000 user@vps
  # Prometheus discovers EVERY api/worker replica via Docker DNS (port 9091).
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["monitoring"]
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: ${PROM_MEM_LIMIT:-1g}
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: ["monitoring"]
    logging: *default-logging
    # Alertmanager does not expand environment variables in its config, so a
    # literal "${ALERT_WEBHOOK_URL}" there was never delivered anywhere. The
    # wrapper writes the URL to a file that slack_configs reads via
    # api_url_file, and refuses to start without one.
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infra/monitoring/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [internal]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    profiles: ["monitoring"]
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required when using the monitoring profile}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      # Bound to loopback only — reach it via an SSH tunnel, never the internet.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [internal]

  # ─── Edge Nginx (TLS termination + reverse proxy) ──────────
  nginx:
    # >= 1.27.3 is required for `server ... resolve` in the upstream blocks.
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Injected into the config template at container start (envsubst).
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # Only substitute ${DOMAIN}; leave nginx's own $host/$uri vars intact.
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./deploy/production/nginx/nari-surokkha.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/production/nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot-www:/var/www/certbot
    logging: *default-logging
    depends_on: [api, admin-portal]
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [internal]

volumes:
  pg_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  internal:
    driver: bridge
