# ============================================================
# Nari Surokkha — LOCAL DEVELOPMENT stack
#
# NOT for production: production is docker-compose.prod.yml (PgBouncer,
# separate worker, TLS nginx, TURN, monitoring, no published DB ports).
#
# Dependencies only (then run the API/portal natively with `npm run dev`):
#   docker compose up -d postgres redis minio minio-init
#
# Everything in containers (API + in-process worker + admin portal):
#   docker compose --profile app up -d --build
#
# Optional self-hosted routing for Safe Route (needs ./scripts/osrm-prepare.sh):
#   docker compose --profile osrm up -d osrm
#
# Every published port is bound to 127.0.0.1, so nothing here is reachable
# from your LAN. The defaults below are DEV-ONLY values; override any of them
# in a root-level .env file (see .env.example).
# ============================================================

x-db-url: &db-url postgresql://${DB_USER:-nari_user}:${DB_PASSWORD:-nari_dev_password}@postgres:5432/${DB_NAME:-nari_surokkha_dev}?schema=public

services:
  # ─── PostgreSQL + PostGIS (same major versions as production) ───
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nari_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nari_dev_password}
      POSTGRES_DB: ${DB_NAME:-nari_surokkha_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis (password-protected, like production) ───────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-nari_dev_redis}
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-nari_dev_redis}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── MinIO (S3-compatible evidence storage; STORAGE_PROVIDER=minio) ───
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      # Recent MinIO images ship without curl; `mc ready local` is the
      # supported liveness probe.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the evidence + public buckets once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/nari-evidence &&
        mc mb --ignore-existing local/nari-public &&
        echo 'MinIO buckets ready.'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  # ─── API (profile: app) — HTTP + in-process BullMQ workers ──
  # NODE_ENV=development: workers run in this process (WORKER_MODE unset),
  # phone OTP is optional and the mock SMS provider returns the OTP as devCode.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3001"
      API_BASE_URL: http://localhost:3001
      DATABASE_URL: *db-url
      # No PgBouncer locally, so migrations use the same database URL.
      DIRECT_DATABASE_URL: *db-url
      REDIS_URL: redis://:${REDIS_PASSWORD:-nari_dev_redis}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nari_dev_redis}
      # DEV-ONLY secrets (>= 64 chars). Never reuse outside your machine.
      JWT_SECRET: ${JWT_SECRET:-dev_only_jwt_secret_change_me_0123456789abcdef0123456789abcdef0123}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_only_refresh_secret_change_me_0123456789abcdef0123456789abcd}
      CORS_ORIGINS: http://localhost:5174,http://localhost:8081,http://localhost:19006
      WS_CORS_ORIGINS: http://localhost:5174,http://localhost:8081,http://localhost:19006
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SMS_PROVIDER: mock
      PHONE_VERIFICATION: optional
      TRUST_PROXY: "false"
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    # Apply migrations, seed roles (+ dev demo users in development), start.
    command: ["sh", "-c", "npx prisma migrate deploy && npm run prisma:seed && node dist/server.js"]

  # ─── Admin portal (profile: app) — production build served by nginx ──
  admin-portal:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api/v1
        VITE_WS_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

  # ─── OSRM routing engine (profile: osrm) ───────────────────
  osrm:
    profiles: ["osrm"]
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-matching-size 2000 /data/map.osrm
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ${OSRM_DIR:-./data/osrm}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:5000/route/v1/foot/90.4,23.8;90.41,23.81' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
