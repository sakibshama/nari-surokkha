# Alertmanager routing.
#
# Set ALERT_WEBHOOK_URL (Slack/Discord/Teams incoming webhook) in
# .env.production. Critical alerts repeat every 30 minutes until resolved —
# an unacknowledged SOS outage should keep nagging.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      repeat_interval: 30m

receivers:
  - name: default
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true

inhibit_rules:
  # If the API is down, do not also page about its latency.
  - source_matchers: [alertname="ApiDown"]
    target_matchers: [severity="critical"]
    equal: ['service']
