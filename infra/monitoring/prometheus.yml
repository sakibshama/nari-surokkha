# Prometheus scrape configuration.
#
# The API exposes /metrics on METRICS_PORT (9091) — a separate port from the
# public API, reachable only on the internal Docker network. It is deliberately
# not proxied by nginx.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: nari-surokkha

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:9091']
        labels:
          component: api

  # The worker runs the same image with WORKER_MODE=true and exposes the same
  # metrics port, so dispatch/notification timings are attributed to it.
  - job_name: 'worker'
    static_configs:
      - targets: ['worker:9091']
        labels:
          component: worker

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
